# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after. If you find
# Jekyll not playing well with path, maybe you are editing this file in the
# wrong directory.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Junteng Liu
email: jliugi@connect.ust.hk
description: >-
  Junteng Liu's personal academic homepage.
  First-year PhD candidate at the HKUST NLP Group,
  researching natural language processing and machine learning.
# Add your logo to /assets/images/ and then set the path here
# https://... (full url)
# https://... (full url)
url: ""
# the subpath of your site, e.g. /blog
baseurl: ""
# the name of the repository (e.g. academicpages.github.io)
repository: "tobyleter/LJT-Homepage"
# The text that will appear in the footer
footer_text: >-
  Powered by Jekyll with
  <a href="http://github.com/academicpages/academicpages.github.io">Academic Pages</a>
  and hosted by GitHub Pages.
# The text that will appear in the navigation bar
# If you want to add a navigation item, add it to the _data/navigation.yml file

# These are the files that do not get built
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Flags
future: true
show_drafts: false
limit_posts: 0
livereload: false

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  syntax_highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed

# Site author
author:
  name: "Junteng Liu"
  avatar: "bio-photo.jpg"
  location: "Hong Kong"
  bio: "First-year PhD candidate at HKUST NLP Group, advised by Professor Junxian He."
  googlescholar: "tbK9jl4AAAAJ"
  orcid: ""
  twitter: "junteng88716710"
  links:
    - href: "mailto:jliugi@connect.ust.hk"
      icon: "fas fa-envelope"
    - href: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
      icon: "ai ai-google-scholar-square"
    - href: "https://github.com/Vicent0205"
      icon: "fab fa-github"
    - href: "https://twitter.com/junteng88716710"
      icon: "fab fa-twitter-square"

# Jekyll-Archives
# https://github.com/jekyll/jekyll-archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-taxonomy
    tag: archive-taxonomy
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Collections
# https://jekyllrb.com/docs/collections/
collections:
  publications:
    output: true
    permalink: /publication/:path/
  talks:
    output: true
    permalink: /talk/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - talkmap/
  - talkmap_out.ipynb
  - talkmap.ipynb
  - talkmap.py
  - Dockerfile
  - docker-compose.yaml
  - .devcontainer/
  - .github/
